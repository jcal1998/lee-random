name: CI/CD

# Pull requests run only the checks (static + dynamic + build).
# A push to main runs the checks, deploys to staging and then, after a
# manual approval on the "production" environment, to GitHub Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch/PR at a time; a newer push cancels an older PR run,
# but never cancels a deploy that is already under way on main.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  # ---------------------------------------------------------------
  # 1. Static analysis
  # ---------------------------------------------------------------
  lint:
    name: Lint, type check and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint + Prettier
        run: npm run lint
      - name: TypeScript (tsc --noEmit)
        run: npm run typecheck
      - name: Audit dependencies
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # ---------------------------------------------------------------
  # 2. Dynamic tests
  # ---------------------------------------------------------------
  unit-tests:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e-tests:
    name: End-to-end tests (Playwright)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------
  # 3. Build (only once every check has passed)
  # ---------------------------------------------------------------
  build:
    name: Build
    needs: [lint, codeql, unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------
  # 4. Deploy to staging (environment 1)
  # ---------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      # Optional. Without it, staging is served inside the runner (see docs/PIPELINE.md).
      SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
      SURGE_DOMAIN: ${{ vars.SURGE_DOMAIN || 'lee-random-staging.surge.sh' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Publish
        id: deploy
        run: |
          if [ -n "$SURGE_TOKEN" ]; then
            rm -f site/CNAME  # the production domain must not be claimed by staging
            npx --yes surge@0.44 ./site "$SURGE_DOMAIN" --token "$SURGE_TOKEN"
            echo "url=https://$SURGE_DOMAIN" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SURGE_TOKEN is not set, so staging is served inside the runner for the smoke test only."
            python3 -m http.server 4173 --directory site > /dev/null 2>&1 &
            echo "url=http://localhost:4173" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke test staging
        run: |
          for i in $(seq 1 10); do
            if curl -fsSL "${{ steps.deploy.outputs.url }}/" -o page.html; then break; fi
            sleep 3
          done
          grep -qi "<title>" page.html
          echo "Staging answered at ${{ steps.deploy.outputs.url }}"

  # ---------------------------------------------------------------
  # 5. Deploy to production (environment 2, needs manual approval)
  # ---------------------------------------------------------------
  deploy-production:
    name: Deploy to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
      - name: Smoke test production
        run: |
          for i in $(seq 1 10); do
            if curl -fsSL "${{ steps.deploy.outputs.page_url }}" -o page.html && grep -qi "<title>" page.html; then
              echo "Production is live at ${{ steps.deploy.outputs.page_url }}"
              exit 0
            fi
            sleep 6
          done
          echo "::error::Production did not answer with the site"
          exit 1
