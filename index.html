<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0b24" />
    <title>Nossa História de Amor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💞</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap"
    />
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="aurora" aria-hidden="true"></div>
    <main class="stage">
      <ol id="progress"></ol>
      <div id="game-container">
        <div id="scene-icon" aria-hidden="true"></div>
        <h2 id="scene-title"></h2>
        <div id="text-box" aria-live="polite"></div>
        <div id="choices-container"></div>
        <div id="navigation-container">
          <button id="next-btn" class="nav-btn">Começar</button>
        </div>
      </div>
      <p class="hint">Dica: use a seta → do teclado para avançar</p>
    </main>
    <div id="hearts" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
